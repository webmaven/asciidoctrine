repos:
  - repo: https://github.com/
    rev: v0.9.6
    hooks:
      # Hook 1: Ultra-Compact Linting (Single-line tokens only)
      - id: ruff
        name: Agent-Concise-Lint
        args: [--format=compact, --quiet, --fix ]

      # Hook 2: Fast Formatting Check (Silent if clean)
      - id: ruff-format
        name: Agent-Concise-Format
        args: [--check, --quiet]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      # Hook 3: Compressed Type Checking (No summaries, no terminal art)
      - id: mypy
        name: Agent-Concise-Typecheck
        additional_dependencies: [lark>=1.1.0, types-docutils, sphinx, docutils]
        exclude: ^tests/
        args: [
          --package, asciidoctrine,
          --pass-filenames: false,
          --no-error-summary,
          --hide-error-context,
          --no-pretty,
          --color-output=never
        ]

  - repo: local
    hooks:
      - id: run-tck-coverage-check
        name: TCK Coverage Check
        entry: ./run-tck-coverage.sh
        language: script
        pass_filenames: false
        types: [python]
        stages: [manual] # Only run manually or in CI, too slow for commit hook

      - id: run-doctests
        name: Asciidoctor Doctests
        entry: env RUN_DOCTESTS=1 venv/bin/pytest tests/test_doctest_parsing.py
        language: system
        pass_filenames: false
        types: [python]
