name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs if a new push is made to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip' # Enable pip caching

    - name: Install dependencies
      run: |
        pip install -e '.[test]'

    - name: Check formatting (ruff)
      run: ruff format --check .

    - name: Lint (ruff)
      run: ruff check .

    - name: Type check (mypy)
      run: mypy src/asciidoctrine

  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'
    - name: Install dependencies
      run: pip install -e '.[docs]'
    - name: Build documentation
      run: sphinx-build -W -b html docs/ docs/_build/html

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/_build/html

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'vendor/asciidoc-tck/package-lock.json'

    - name: Install dependencies
      run: |
        pip install -e '.[test]'
        pip install coverage pytest-cov

    - name: Run Core Tests with Coverage
      run: |
        coverage erase
        coverage run --parallel-mode --source=src/asciidoctrine -m pytest --ignore=tests/test_tck.py --ignore=tests/test_doctest_parsing.py --ignore=tests/test_functional.py

    - name: Run TCK with Coverage
      run: |
        coverage run --parallel-mode --source=src/asciidoctrine -m pytest tests/test_tck.py

    - name: Run DocTest Parsing with Coverage
      env:
        RUN_DOCTESTS: "1"
      run: |
        coverage run --parallel-mode --source=src/asciidoctrine -m pytest tests/test_doctest_parsing.py

    - name: Combine and Check Coverage
      run: |
        coverage combine
        coverage report --show-missing --fail-under=75
        coverage html # Generate HTML report for artifact

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-3.14
        path: htmlcov/
        if-no-files-found: ignore

  test-pyodide:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        pip install build pytest-pyodide

    - name: Build wheel
      run: |
        python -m build --wheel
        # Download lark dependency into dist directory for pyodide to find it
        pip download lark -d dist/
        # Download and extract pyodide distribution
        curl -L https://github.com/pyodide/pyodide/releases/download/314.0.2/pyodide-314.0.2.tar.bz2 -o pyodide.tar.bz2
        tar -xjf pyodide.tar.bz2
        cp -r pyodide/* dist/
        rm -rf pyodide pyodide.tar.bz2

    - name: Run tests under Pyodide
      run: |
        # Use node runtime for headless CI
        pytest --runtime node --dist-dir dist/ tests/test_functional.py
