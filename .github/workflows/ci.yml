name: CI

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install -e '.[test]'

    - name: Check formatting (ruff)
      run: ruff format --check .

    - name: Lint (ruff)
      run: ruff check .

    - name: Type check (mypy)
      run: mypy src/asciidoc_parser

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        pip install -e '.[test]'
        pip install coverage pytest-cov

    - name: Run Core Tests with Coverage
      run: |
        coverage run --parallel-mode -m pytest --ignore=tests/test_tck.py --ignore=tests/test_doctest_parsing.py

    - name: Run TCK with Coverage
      run: |
        # Use our coverage version of the runner
        # Need to ensure bin/tck-adapter.py uses 'coverage run' internally or via this script
        chmod +x run-tck-coverage.sh
        ./run-tck-coverage.sh

    - name: Run DocTest Parsing with Coverage
      run: |
        coverage run --parallel-mode -m pytest tests/test_doctest_parsing.py

    - name: Combine and Check Coverage
      run: |
        coverage combine
        coverage report --show-missing --fail-under=75

  test-pyodide:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install build pytest-pyodide

    - name: Build wheel
      run: python -m build --wheel

    - name: Run tests under Pyodide
      run: |
        # pytest-pyodide runs tests in a browser environment (via selenium/playwright) 
        # or in a Node.js environment. We'll use the default which often uses Chrome.
        # Since we are in headless environment, we might need some extra setup or use 'node' runner.
        # For simplicity in this demo, we ensure it parses basic strings.
        pytest --runtime pyodide-node tests/test_functional.py
