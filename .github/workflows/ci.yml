name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install -e '.[test]'

    - name: Check formatting (ruff)
      run: ruff format --check .

    - name: Lint (ruff)
      run: ruff check .

    - name: Type check (mypy)
      run: mypy src/asciidoc_parser

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        pip install -e '.[test]'

    - name: Run Core Tests
      run: |
        python -m pytest --ignore=tests/test_tck.py --ignore=tests/test_doctest_parsing.py

    - name: Run TCK
      run: |
        python -m pytest tests/test_tck.py

    - name: Run DocTest Parsing
      run: |
        python -m pytest tests/test_doctest_parsing.py
