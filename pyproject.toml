[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asciidoc-parser"
version = "0.1.0"
authors = [
  { name = "Michael R. Bernstein", email = "zopemaven@gmail.com" },
]
description = "A high-performance, pure-Python AsciiDoc parser based on Lark."
readme = { file = "README.adoc", content-type = "text/plain" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "lark>=1.1.0",
]

[project.urls]
"Homepage" = "https://github.com/webmaven/asciidoc_parser"
"Bug Tracker" = "https://github.com/webmaven/asciidoc_parser/issues"

[project.optional-dependencies]
test = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
