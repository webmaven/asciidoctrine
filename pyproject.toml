[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asciidoctrine"
version = "0.2.0a8"
authors = [
  { name = "Michael R. Bernstein", email = "zopemaven@gmail.com" },
]
description = "A high-performance, pure-Python AsciiDoc parser based on Lark."
readme = { file = "README.adoc", content-type = "text/plain" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "lark==1.3.1",
    "platformdirs",
]

[project.urls]
"Homepage" = "https://webmaven.github.io/asciidoctrine/"
"Documentation" = "https://webmaven.github.io/asciidoctrine/"
"Repository" = "https://github.com/webmaven/asciidoctrine"
"Source Code" = "https://github.com/webmaven/asciidoctrine"
"Bug Tracker" = "https://github.com/webmaven/asciidoctrine/issues"
"Changelog" = "https://github.com/webmaven/asciidoctrine/blob/main/CHANGELOG.adoc"
"PyPI" = "https://pypi.org/project/asciidoctrine/"

[project.optional-dependencies]
test = ["pytest", "ruff", "mypy", "docutils", "types-docutils", "sphinx", "pytest-pyodide", "playwright", "pytest-cov", "pytest-xdist", "asciidoctest>=0.2.0a2; python_version >= '3.14'", "asciidocstring>=0.1.0a6; python_version >= '3.14'"]
docs = ["sphinx", "sphinx-rtd-theme", "sphinx-asciidoctrine>=0.1.0a2", "sphinx-autodoc2"]

[tool.hatch.build.targets.wheel]
packages = ["src/asciidoctrine"]
core-metadata-version = "2.3"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.3"

[tool.hatch.envs.default]
installer = "uv"
features = ["test", "docs"]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
lint = "ruff check {args:.}"
format = "ruff format {args:.}"
typecheck = "mypy src/asciidoctrine {args}"
docs-build = "sphinx-build -a -E -b html docs docs/_build/html {args}"
docs-serve = "python -m http.server --directory docs/_build/html 8000"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-n auto"
norecursedirs = ["vendor", "venv", ".git", "docs", "tests/include_fixtures", "tests/tck_harness"]

markers = [
    "unit: Fast, isolated unit tests for core module logic.",
    "integration: Integration tests exercising full parsing, ASG transformations, and serialization.",
    "functional: Functional/TCK tests running against the full Pyodide or Node.js environment.",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["vendor", "venv", ".git"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["asciidoctrine"]
mypy_path = "src"
ignore_missing_imports = true

[tool.coverage.run]

[tool.coverage.report]
fail_under = 75
show_missing = true
